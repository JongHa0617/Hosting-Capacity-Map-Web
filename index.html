<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hosting Capacity Management System</title>
<script>
(function () {
    'use strict';
    var requested = new URLSearchParams(window.location.search).get('view');
    var mobile = window.matchMedia('(max-width: 700px)').matches;
    var page = requested === 'pc' ? 'pc.html'
             : requested === 'mobile' ? 'mobile.html'
             : mobile ? 'mobile.html' : 'pc.html';
    window.location.replace(new URL(page, window.location.href).href);
})();
</script>
</head>
<body>
<p>Hosting Capacity Map으로 이동 중입니다.</p>
<p><a href="pc.html">PC 버전</a> | <a href="mobile.html">모바일 버전</a></p>
</body>
</html>
